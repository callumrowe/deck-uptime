owner: callumrowe
repo: deck-uptime

# One site, and deliberately the health endpoint rather than the homepage.
#
# `/healthz` runs a real `select 1` against Postgres instead of returning 200
# for a booted process, so a check that passes from the public URL means the
# whole chain a user depends on is genuinely up: Hetzner host, Docker, the
# platform Caddy, the app, and the database. The app's own deploy gates on this
# same endpoint for the same reason.
#
# The point of running it from here is that it runs *off* the box. Everything
# else watching Deck — the signals worker, the error reporter — is a process on
# the host it is watching, so a dead host produces no alert, just silence. This
# is the only signal whose absence cannot be mistaken for good news.
sites:
  - name: Deck
    url: https://deck.cjhr.dev/healthz

# Downtime opens an issue in this repository; it closes itself on recovery.
assignees:
  - callumrowe

status-website:
  # Served by GitHub Pages, off the Hetzner box, on purpose: a status page
  # hosted on the infrastructure it reports on goes down with it. The DNS is a
  # CNAME to callumrowe.github.io, deliberately not an A record to the server
  # and deliberately not proxied — GitHub issues its own certificate and cannot
  # validate through Cloudflare's proxy.
  #
  # Upptime writes the CNAME file on gh-pages from this value, so it must stay
  # in step with the custom domain configured on the repository's Pages
  # settings; the site build overwrites that branch on every run.
  cname: status.cjhr.dev
  name: Deck Status
  introTitle: "**Deck** — live status"
  introMessage: Checked every five minutes from GitHub Actions, outside the server Deck runs on. Outages open an [issue](https://github.com/callumrowe/deck-uptime/issues) and post to Slack.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Values passed through to the workflows from repository secrets.
# NOTIFICATION_SLACK is the literal string "true"; the webhook URL points at
# Deck's dedicated uptime channel, kept separate from the sync, infra, backups
# and error channels so an outage is never buried in, or muted with, anything
# else.
secrets:
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL
